name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  android:
    needs: test
    runs-on: ubuntu-latest
    # Holds the signing secrets, so only tags allowed by this environment can read them.
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.YOMI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.YOMI_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yomi-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=yomi\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/yomi-release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" \
            > app/android/key.properties
      - name: Build APK
        env:
          TAG: ${{ github.ref_name }}
        run: app/scripts/build_android.sh "${TAG#v}"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android
          path: |
            release/Yomi-android.apk
            release/Yomi-android.apk.sha256
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Build Mac app
        env:
          TAG: ${{ github.ref_name }}
        run: app/scripts/build_macos.sh --build-name="${TAG#v}"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: macos
          path: release/Yomi-macOS.zip
          if-no-files-found: error

  publish:
    needs: [android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Yomi-android.apk
            dist/Yomi-android.apk.sha256
            dist/Yomi-macOS.zip
